<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة أ/ أحمد أبو السعود | تسجيل الطلاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        :root { --bg-primary:#D2B48C; --accent:#6E260E; --dark:#280C02; }
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins','Cairo',sans-serif; }
        body{ height:100vh; display:flex; background:var(--bg-primary); overflow:hidden; }

        /* ── Split ── */
        .split-container{ display:flex; width:100%; height:100%; }

        /* ── Instructor side ── */
        .instructor-side{
            flex:1; display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            color:#fff; padding:40px; text-align:center;
            background:var(--dark); position:relative;
        }
        .instructor-image{
            width:180px; height:180px; border-radius:50%;
            margin-bottom:25px; border:5px solid #fff;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            animation:float 4s ease-in-out infinite;
            overflow:hidden; background:rgba(255,255,255,.15);
            display:flex; align-items:center; justify-content:center;
        }
        .instructor-side h1{ font-size:2.5rem; margin-bottom:10px; font-weight:700; font-family:'Cairo',sans-serif; }
        .instructor-side p { font-size:1.1rem; max-width:400px; line-height:1.6; opacity:.9; font-family:'Cairo',sans-serif; }

        /* ── Form side ── */
        .form-side{
            flex:1; background:var(--bg-primary);
            display:flex; justify-content:center; align-items:center;
            border-top-right-radius:50px; border-bottom-right-radius:50px;
            box-shadow:10px 0 30px rgba(0,0,0,.05);
            animation:slideInLeft .8s ease-out;
            overflow-y:auto;
            order:-1;
        }
        .login-card{ width:100%; max-width:430px; padding:30px; }

        h2{
            color:var(--accent); margin-bottom:20px; font-weight:700;
            text-align:center; font-family:'Cairo',sans-serif; font-size:1.4rem;
        }

        /* ── Inputs ── */
        .input-group{ margin-bottom:12px; }
        label{
            display:block; font-size:13px; margin-bottom:5px;
            color:#555; font-weight:600;
            direction:rtl; text-align:right; font-family:'Cairo',sans-serif;
        }
        input, select{
            width:100%; padding:11px 14px;
            border:1.5px solid #e0d0ba; border-radius:10px;
            outline:none; transition:.3s; background:#fdfdfd;
            direction:rtl; text-align:right;
            font-family:'Cairo',sans-serif; font-size:14px; color:#333;
        }
        input:focus, select:focus{
            border-color:#B8966A;
            box-shadow:0 0 0 3px rgba(184,150,106,.2);
        }

        /* ── Password eye ── */
        .password-wrap{ position:relative; }
        .password-wrap input{ padding-left:44px; }
        .eye-btn{
            position:absolute; left:12px; top:50%; transform:translateY(-50%);
            background:none; border:none; cursor:pointer;
            color:#aaa; font-size:1rem; padding:4px; transition:color .2s;
        }
        .eye-btn:hover{ color:var(--accent); }

        /* ── System selector ── */
        .system-group{ margin-bottom:12px; }
        .system-group > label{ margin-bottom:8px; }
        .system-options{ display:flex; gap:8px; }
        .system-option{ flex:1; }
        .system-option input[type="radio"]{ display:none; }
        .system-option label{
            display:flex; flex-direction:column; align-items:center;
            gap:5px; padding:10px 6px;
            border:2px solid #ddd; border-radius:12px;
            background:#fdfdfd; cursor:pointer;
            font-size:13px; font-weight:700; color:#888;
            transition:all .25s; text-align:center; line-height:1.3;
        }
        .system-option label i{ font-size:1.3rem; }
        .system-option input[type="radio"]:checked + label{
            border-color:var(--accent);
            background:rgba(110,38,14,.07);
            color:var(--accent);
            box-shadow:0 0 0 3px rgba(110,38,14,.12);
        }

        /* ── Submit ── */
        .submit-btn{
            width:100%; padding:14px;
            background:var(--dark); color:#fff;
            border:none; border-radius:10px;
            font-size:15px; font-weight:700; cursor:pointer;
            transition:.3s; margin-top:14px;
            font-family:'Cairo',sans-serif;
        }
        .submit-btn:hover{
            filter:brightness(1.35);
            box-shadow:0 5px 18px rgba(110,38,14,.4);
            letter-spacing:.5px;
        }

        /* ── Animations ── */
        @keyframes float{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-20px);} }
        @keyframes slideInLeft{ from{transform:translateX(-100%);opacity:0;} to{transform:translateX(0);opacity:1;} }
        @keyframes slideInRight{ from{transform:translateX(100%);opacity:0;} to{transform:translateX(0);opacity:1;} }

        /* ── Tablet ── */
        @media(max-width:900px){
            body{ overflow-y:auto; height:auto; }
            .split-container{ flex-direction:column; }
            .form-side{
                border-radius:0; padding:30px 20px;
                order:0; min-height:auto;
            }
            .instructor-side{ padding:36px 20px 28px; min-height:auto; }
            .system-options{ gap:6px; }
            .instructor-image{ width:120px; height:120px; margin-bottom:14px; }
            .instructor-side h1{ font-size:1.6rem; margin-bottom:6px; }
            .instructor-side p{ font-size:.95rem; }
        }

        /* ── Mobile ── */
        @media(max-width:480px){
            .login-card{ padding:20px 16px; }
            h2{ font-size:1.2rem; margin-bottom:14px; }
            input, select{ padding:10px 12px; font-size:13px; }
            label{ font-size:12px; }
            .input-group{ margin-bottom:10px; }
            .system-group{ margin-bottom:10px; }
            .system-option label{
                padding:8px 4px; font-size:11px; gap:4px;
            }
            .system-option label i{ font-size:1.1rem; }
            .submit-btn{ padding:12px; font-size:14px; margin-top:10px; }
            .instructor-side{ padding:24px 16px 20px; }
            .instructor-image{ width:90px; height:90px; margin-bottom:10px; border-width:3px; }
            .instructor-side h1{ font-size:1.3rem; }
            .instructor-side p{ font-size:.85rem; line-height:1.5; }
            .row-flex select{ font-size:12px; padding:9px 8px; }
        }

        /* ── Small phones ── */
        @media(max-width:360px){
            .system-options{ gap:4px; }
            .system-option label{ padding:7px 3px; font-size:10.5px; }
            .system-option label i{ font-size:1rem; }
        }
    </style>
</head>
<body>

<div class="split-container">

    <div class="instructor-side">
        <div class="instructor-image">
            <img src="/static/images/logo.png" alt="الأستاذ"
                 style="width:100%;height:100%;object-fit:cover;border-radius:50%;"
                 onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\'fas fa-user\' style=\'font-size:4rem;color:rgba(255,255,255,.5);\'></i>'"/>
        </div>
        <h1>أ/ أحمد أبو السعود</h1>
        <p>مرحباً بك يا بطل! هنا نبني مستقبلك في مادة التاريخ خطوة بخطوة. انضم إلينا الآن وابدأ رحلة النجاح.</p>
    </div>

    <div class="form-side">
        <div class="login-card">
            <h2>سجّل لتتفوق في التاريخ</h2>

            <form method="POST" action="{% url 'signup' %}">
                {% csrf_token %} <div class="input-group">
                    <label>اسم الطالب كاملاً (للتسجيل بالإنجليزية)</label>
                    <input type="text" name="full_name" placeholder="اكتب اسمك هنا (مثال: ahmed_2026)" required>
                </div>

                <div class="input-group">
                    <label>رقم هاتف الطالب</label>
                    <input type="tel" name="student_phone" placeholder="01xxxxxxxxx" required>
                </div>

                <div class="input-group">
                    <label>رقم هاتف ولي الأمر</label>
                    <input type="tel" name="parent_phone" placeholder="01xxxxxxxxx" required>
                </div>

                <div class="system-group">
                    <label>النظام التعليمي</label>
                    <div class="system-options">
                        <div class="system-option">
                            <input type="radio" name="system" id="sys-general" value="general" required>
                            <label for="sys-general">
                                <i class="fas fa-school"></i>عام
                            </label>
                        </div>
                        <div class="system-option">
                            <input type="radio" name="system" id="sys-azhar" value="azhar">
                            <label for="sys-azhar">
                                <i class="fas fa-mosque"></i>أزهري
                            </label>
                        </div>
                        <div class="system-option">
                            <input type="radio" name="system" id="sys-bak" value="bakaloria">
                            <label for="sys-bak">
                                <i class="fas fa-globe"></i>بكالوريا
                            </label>
                        </div>
                    </div>
                </div>

                <div class="row-flex" style="display:flex;gap:10px;">
                    <div class="input-group" style="flex:1;">
                        <label>الصف الدراسي</label>
                        <select name="grade" required>
                            <option value="1">الصف الثاني</option>
                            <option value="2">الصف الثالث</option>
                        </select>
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label>المحافظة</label>
                        <select name="governorate" required>
                            <option>القاهرة</option><option>المنصورة</option>
                            <option>الإسكندرية</option><option>كفر الشيخ</option>
                            <option>الجيزة</option><option>القليوبية</option>
                            <option>الدقهلية</option><option>المنوفية</option>
                            <option>الغربية</option><option>البحيرة</option>
                            <option>دمياط</option><option>الشرقية</option>
                            <option>بورسعيد</option><option>السويس</option>
                            <option>الإسماعيلية</option><option>شمال سيناء</option>
                            <option>جنوب سيناء</option><option>مرسى مطروح</option>
                            <option>الوادي الجديد</option><option>البحر الأحمر</option>
                            <option>الفيوم</option><option>بني سويف</option>
                            <option>المنيا</option><option>أسيوط</option>
                            <option>سوهاج</option><option>الأقصر</option>
                            <option>أسوان</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>كلمة المرور</label>
                    <div class="password-wrap">
                        <input type="password" id="passwordInput" name="password"
                               placeholder="••••••••" required>
                        <button type="button" class="eye-btn" onclick="togglePassword()"
                                title="إظهار / إخفاء كلمة المرور">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                {% if error %}
                    <div style="color: #6E260E; background: rgba(110,38,14,.07); text-align: center; padding: 8px; border-radius: 8px; margin-top: 10px; font-weight: 700; font-size: 13px;">
                        {{ error }}
                    </div>
                {% endif %}

                <button type="submit" class="submit-btn">
                    <i class="fas fa-user-plus" style="margin-left:8px;"></i>تسجيل الحساب
                </button>

                <p style="text-align:center;margin-top:14px;font-family:'Cairo',sans-serif;font-size:13px;color:#6B4530;">
                    عندك حساب بالفعل؟
                    <a href="{% url 'signin' %}" style="color:var(--accent);font-weight:700;text-decoration:none;">
                        سجّل دخول
                    </a>
                </p>
            </form>
        </div>
    </div>

</div>

<script>
function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon  = document.getElementById('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
    }
}
</script>

</body>
</html>
