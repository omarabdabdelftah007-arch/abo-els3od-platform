<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة أ/ أحمد أبو السعود | تسجيل الطلاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #D2B48C;
            --accent-color: #6E260E;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Cairo', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            background-color: var(--bg-primary);
            overflow: hidden;
        }

        /* Container الرئيسي المقسم */
        .split-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* الجزء الخاص بالمدرس */
        .instructor-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 40px;
            text-align: center;
            background: #280C02;
            position: relative;
        }

        .instructor-image {
            width: 180px;
            height: 180px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            margin-bottom: 25px;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: float 4s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 50px;
        }

        .instructor-side h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .instructor-side p {
            font-size: 1.1rem;
            max-width: 400px;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* الجزء الخاص بالتسجيل */
        .form-side {
            flex: 1;
            background: #D2B48C;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top-left-radius: 50px;
            border-bottom-left-radius: 50px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.05);
            animation: slideInRight 0.8s ease-out;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 30px;
        }

        h2 {
            color: var(--accent-color);
            margin-bottom: 25px;
            font-weight: 600;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #eee;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
            background: #fdfdfd;
        }

        input:focus, select:focus {
            border-color: var(--bg-primary);
            box-shadow: 0 0 8px rgba(210, 180, 140, 0.4);
            transform: scale(1.01);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #280C02;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }

        .submit-btn:hover {
            letter-spacing: 1px;
            filter: brightness(1.3);
            box-shadow: 0 5px 15px rgba(110, 38, 14, 0.4);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .login-card, .login-card form, .login-card label,
        .login-card h2, .login-card input, .login-card select {
            direction: rtl;
            text-align: right;
            font-family: 'Cairo', sans-serif;
        }
        .instructor-side h1, .instructor-side p {
            font-family: 'Cairo', sans-serif;
        }
        @media (max-width: 900px) {
            body { overflow-y: auto; }
            .split-container { flex-direction: column; }
            .form-side { border-radius: 0; padding: 40px 20px; }
            .instructor-side { padding: 60px 20px; }
        }
    </style>
</head>
